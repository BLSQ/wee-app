# Neon's Free plan allows 10 database branches per project, and the Vercel integration creates one
# per pull request. It only removes them when Vercel drops the preview deployments, months later,
# so without this the eleventh pull request fails with "Resource provisioning failed".
name: Delete the Neon preview branch

on:
  pull_request:
    types: [closed]

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
